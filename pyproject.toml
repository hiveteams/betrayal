[project]
name = "betrayal"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "google-genai>=3.6.1",
    "openai>=3.57.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
paper = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
